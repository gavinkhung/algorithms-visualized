<!-- Loading message, shown until the notebook draws its first output. -->
<div id="algoviz-loading" role="status" aria-live="polite">
  <div class="algoviz-spinner"></div>
  <p class="algoviz-title">Starting the visualizer…</p>
  <p class="algoviz-detail">
    Python runs right in your browser, so this takes 10-30 seconds. Later visits
    skip the download and start faster.
  </p>
</div>
<style>
  #algoviz-loading {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 0.75rem;
    padding: 10rem 1rem 1rem;
    background: #fff;
    color: #333;
    font-family: Georgia, serif;
    text-align: center;
    transition: opacity 0.3s;
  }
  #algoviz-loading.done {
    opacity: 0;
    pointer-events: none;
  }
  #algoviz-loading p {
    margin: 0;
    max-width: 28rem;
  }
  .algoviz-title {
    font-size: 1.25rem;
  }
  .algoviz-detail {
    color: #666;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .algoviz-spinner {
    width: 2.25rem;
    height: 2.25rem;
    border: 3px solid #ddd;
    border-top-color: #555;
    border-radius: 50%;
    animation: algoviz-spin 0.9s linear infinite;
  }
  @keyframes algoviz-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
<script>
  (function () {
    // After SLOW ms the message suggests a refresh; after GIVE_UP ms the
    // overlay goes, so marimo's own progress or error shows through.
    var SLOW = 30000;
    var GIVE_UP = 60000;
    var overlay = document.getElementById("algoviz-loading");
    var detail = overlay.querySelector(".algoviz-detail");
    var start = Date.now();
    var timer = setInterval(function () {
      var waited = Date.now() - start;
      var ready = document.querySelector(".output-area img, marimo-ui-element");
      if (waited > SLOW && !overlay.dataset.slow) {
        overlay.dataset.slow = "1";
        detail.textContent =
          "Still loading. On a slow connection this can take a while; " +
          "if nothing changes, try refreshing the page.";
      }
      if (ready || waited > GIVE_UP) {
        clearInterval(timer);
        overlay.classList.add("done");
        setTimeout(function () {
          overlay.remove();
        }, 400);
      }
    }, 250);
  })();
</script>
